{% extends 'users/userbase.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acute Lymphoblastic Leukemia Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
        .result {
            font-size: 1.5em;
            color: #50fd00;
        }
    </style>
</head>
<body>
    <h1><span class="text-white">Acute Lymphoblastic Leukemia Detection</spam></h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="image"><span class="text-white">Upload an Image:</span></label>
        <input type="file" id="image" name="image" accept="image/*" required>
        <button type="submit">Predict</button>
    </form>

    {% if predicted_class %}
    <div class="result">
        <h2>Prediction: {{ predicted_class }}</h2>
    </div>
    {% endif %}

    
</body>
</html>
{% endblock %}
